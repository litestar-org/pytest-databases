name: Container Runtime Conformance

on:
  pull_request:
    paths:
      - ".github/workflows/runtime-conformance.yaml"
      - "src/pytest_databases/_service.py"
      - "src/pytest_databases/runtime.py"
      - "tests/test_runtime.py"
      - "tests/test_runtime_conformance.py"
      - "tests/test_service_host_port.py"
      - "tests/test_service_ownership.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  conformance:
    name: ${{ matrix.runtime }} API conformance
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runtime: [docker, podman]
    env:
      PYTEST_DATABASES_CONFORMANCE: "1"
      PYTEST_DATABASES_CONTAINER_RUNTIME: ${{ matrix.runtime }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install test dependencies
        run: uv sync --frozen --no-dev --group test

      - name: Start rootless Podman API
        if: matrix.runtime == 'podman'
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman info
          socket="$RUNNER_TEMP/podman.sock"
          podman system service --time=0 "unix://$socket" >"$RUNNER_TEMP/podman-service.log" 2>&1 &
          for attempt in {1..30}; do
            if [[ -S "$socket" ]]; then
              echo "CONTAINER_HOST=unix://$socket" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/podman-service.log"
          exit 1

      - name: Run runtime conformance
        run: uv run pytest tests/test_runtime_conformance.py tests/test_service_host_port.py -q
